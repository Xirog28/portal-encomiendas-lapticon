
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Encomiendas Lapticon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Portal de Encomiendas Lapticon</h1>
        <p>Conectamos viajeros con personas que necesitan enviar encomiendas.</p>
    </header>

    <main>
        <!-- BLOQUE 1: INICIO DE SESIÓN -->
        <section id="login-section">
            <h2>Iniciar sesión</h2>

            <form id="login-form">
                <label for="login-email">Correo electrónico</label>
                <input
                    type="email"
                    id="login-email"
                    placeholder="Ingresa tu correo"
                    required
                >

                <label for="login-password">Contraseña</label>
                <input
                    type="password"
                    id="login-password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <button type="submit">Ingresar</button>
            </form>

            <p id="login-status" role="status"></p>
        </section>

        <!-- EL PORTAL SE MUESTRA DESPUÉS DEL LOGIN -->
        <section id="app-section" hidden>
            <p id="welcome-message"></p>

            <!-- BLOQUE 2: CIUDADES -->
            <section>
                <h2>Ciudades disponibles</h2>

                <label for="origen-select">Ciudad de origen</label>
                <select id="origen-select" required>
                    <option value="">Selecciona el origen</option>
                </select>

                <label for="destino-select">Ciudad de destino</label>
                <select id="destino-select" required>
                    <option value="">Selecciona el destino</option>
                </select>
            </section>

            <!-- BLOQUE 3: REGISTRAR ENCOMIENDA -->
            <section>
                <h2>Registrar encomienda</h2>

                <form id="encomienda-form">
                    <label for="valor-input">Valor de la encomienda</label>
                    <input
                        type="number"
                        id="valor-input"
                        min="0.01"
                        step="0.01"
                        placeholder="Ej. 150000"
                        required
                    >

                    <label for="moneda-select">Moneda</label>
                    <select id="moneda-select" required>
                        <option value="COP">COP - Peso colombiano</option>
                        <option value="USD">USD - Dólar estadounidense</option>
                    </select>

                    <label for="observaciones-input">Observaciones</label>
                    <textarea
                        id="observaciones-input"
                        placeholder="Detalles de la encomienda"
                        required
                    ></textarea>

                    <button type="submit">Crear encomienda</button>
                </form>

                <p id="encomienda-status" role="status"></p>
            </section>

            <!-- BLOQUE 4: LISTAR ENCOMIENDAS -->
            <section>
                <h2>Mis encomiendas</h2>

                <div class="table-container">
                    <table id="encomiendas-table">
                        <thead>
                            <tr>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Estado</th>
                                <th>Valor</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="encomiendas-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>Portal de Encomiendas Lapticon</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
